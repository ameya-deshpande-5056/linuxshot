name: Release Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  flatpak:
    name: Build Flatpak Release Bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.8
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build Flatpak & Bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: LinuxShot-${{ env.VERSION }}-x86_64.flatpak
          manifest-path: packaging/flatpak/org.linuxshot.LinuxShot.yaml
          cache: true
          branch: stable

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: LinuxShot-${{ env.VERSION }}-x86_64.flatpak
          if-no-files-found: error

  release:
    name: Build & Publish Release
    runs-on: ubuntu-24.04
    needs: flatpak

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Building release for Tag: ${TAG}, Version: ${VERSION}"

      - name: Extract & Verify Changelog
        id: extract_changelog
        run: |
          python3 - <<'EOF'
          import os, re, sys

          version = os.environ.get("VERSION", "").strip()
          changelog_path = "CHANGELOG.md"

          if not os.path.exists(changelog_path):
              print(f"Error: {changelog_path} not found!", file=sys.stderr)
              sys.exit(1)

          with open(changelog_path, "r", encoding="utf-8") as f:
              content = f.read()

          # Match section: ## [VERSION] - DATE ... until next ## [ or EOF
          pattern = rf'##\s*\[{re.escape(version)}\][^\n]*\n(.*?)(?=\n##\s*\[|\Z)'
          match = re.search(pattern, content, re.DOTALL)

          if not match:
              print("=" * 70, file=sys.stderr)
              print(f"ERROR: No changelog entry found in CHANGELOG.md for version [{version}]!", file=sys.stderr)
              print("Updating CHANGELOG.md is mandatory before releasing a new version.", file=sys.stderr)
              print(f"Please add a section '## [{version}] - YYYY-MM-DD' before tagging.", file=sys.stderr)
              print("=" * 70, file=sys.stderr)
              sys.exit(1)

          notes = match.group(1).strip()
          if not notes:
              print(f"ERROR: Changelog section for [{version}] is empty!", file=sys.stderr)
              sys.exit(1)

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(f"## What's Changed in v{version}\n\n")
              f.write(notes + "\n")

          print(f"Successfully extracted changelog for version {version}:")
          print(notes)
          EOF

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            qt6-base-dev \
            libqt6svg6 \
            libxcb1-dev \
            libxcb-shm0-dev \
            libxcb-keysyms1-dev \
            libx11-dev \
            squashfs-tools \
            curl

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON

      - name: Build LinuxShot
        run: cmake --build build -j$(nproc)

      - name: Run Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Build Debian Package
        run: ./packaging/build-deb.sh "${VERSION}"

      - name: Build AppImage Package
        run: ./packaging/build-appimage.sh "${VERSION}"

      - name: Download Flatpak Bundle
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle
          path: packaging/flatpak/

      - name: Generate Checksums
        run: |
          cd packaging
          sha256sum \
            appimage/LinuxShot-${VERSION}-x86_64.AppImage \
            deb/linuxshot_${VERSION}_amd64.deb \
            flatpak/LinuxShot-${VERSION}-x86_64.flatpak > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "LinuxShot v${{ env.VERSION }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            packaging/appimage/LinuxShot-${{ env.VERSION }}-x86_64.AppImage
            packaging/deb/linuxshot_${{ env.VERSION }}_amd64.deb
            packaging/flatpak/LinuxShot-${{ env.VERSION }}-x86_64.flatpak
            packaging/SHA256SUMS.txt
